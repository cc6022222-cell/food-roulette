const $=id=>document.getElementById(id);let pos=null,near=[],items=[],busy=false,rotation=0,last=0;let db={fav:{},blocked:{},ratings:{}};try{db=JSON.parse(localStorage.getItem('foodroulette-free-v1'))||db}catch{}db.meta=db.meta||{};function save(){try{localStorage.setItem('foodroulette-free-v1',JSON.stringify(db))}catch{$('status').textContent='瀏覽器無法儲存資料'}}function msg(t){$('status').textContent=t}function km(a,b){let r=Math.PI/180,d=Math.sin((b.lat-a.lat)*r/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin((b.lon-a.lon)*r/2)**2;return 6371*2*Math.asin(Math.sqrt(Math.min(1,d)))}$('geo').onclick=()=>{if(!navigator.geolocation)return msg('此瀏覽器不支援定位');msg('定位中…');navigator.geolocation.getCurrentPosition(p=>{pos={lat:p.coords.latitude,lon:p.coords.longitude};$('place').value=pos.lat.toFixed(5)+', '+pos.lon.toFixed(5);msg('定位成功，請搜尋店家')},()=>msg('定位失敗，請允許定位或手動查詢地址'),{timeout:12000})};$('place').oninput=()=>{pos=null};$('address').onclick=async()=>{let q=$('place').value.trim();if(!q)return;let m=q.match(/^(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)$/);if(m){pos={lat:+m[1],lon:+m[2]};return msg('座標已設定')} $('address').disabled=true;try{let r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(q));if(!r.ok)throw Error();let a=await r.json();if(!a.length)return msg('找不到地址');pos={lat:+a[0].lat,lon:+a[0].lon};msg('已定位：'+a[0].display_name)}catch{msg('地址服務暫時無法使用')}finally{setTimeout(()=>$('address').disabled=false,1100)}};
